# Builds the ACC Plant Management app and publishes it to GitHub Pages (branch main).
# Runs on a push to main, or by hand (Actions > Deploy > Run workflow).
#
# One-time setup in the repository settings:
#   1. Settings > Pages > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables:
#        PLANT_API_URL  the web-app URL of the plant Apps Script deployment (ends in /exec)
#        LIVE_API_URL   (optional) the live downtime app's web-app URL, only so this workflow can refuse to mix them up
# The URLs are variables, never files in the repository.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the backend address
        env:
          PLANT_API_URL: ${{ vars.PLANT_API_URL }}
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
        run: |
          if [ -z "$PLANT_API_URL" ]; then
            echo "PLANT_API_URL is not set. A deployed copy must talk to a real backend, not the demo data."; exit 1
          fi
          if [ -n "$LIVE_API_URL" ] && [ "$PLANT_API_URL" = "$LIVE_API_URL" ]; then
            echo "PLANT_API_URL equals LIVE_API_URL. The plant app must never use the live downtime backend."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        env:
          VITE_API_URL: ${{ vars.PLANT_API_URL }}
          VITE_BASE: ./
          VITE_ENV_LABEL: PLANT TEST
          VITE_STORAGE_PREFIX: 'acc-dt-plant:'
        run: |
          npm ci
          npm run typecheck
          env -u VITE_API_URL -u VITE_ENV_LABEL -u VITE_STORAGE_PREFIX npm test
          npm run test:backend
          npm run build

      - name: Confirm the build has no demo data or demo accounts
        run: |
          if grep -rl "Demo-Pass-1234" dist >/dev/null 2>&1; then
            echo "The build contains demo accounts. VITE_API_URL was not applied."; exit 1
          fi
          if grep -rlE "__accTestUpdate|acc:update-ready" dist >/dev/null 2>&1; then
            echo "The build contains the update-banner test hook. It must only exist in the demo build."; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
